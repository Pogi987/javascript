<html>
<head>
<meta charset="UTF-8">
<title>Zadanie 17 Orzel</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>
<script type="text/javascript">
function pole_orz()
{
var a_orz= parseFloat(document.getElementById('dlugosc').value);
var b_orz= a_orz*a_orz;
document.getElementById("nazwa").innerHTML ="Pole kwadrat= "+b_orz.toFixed(2)+" cm^2";
}

function obwod_orz()
{
var a_orz= parseFloat(document.getElementById('dlugosc').value);
var b_orz= 4*a_orz;
document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_orz.toFixed(2)+" cm";
}
</script>
<h1>Wszystko o KWADRACIE</h1><br><br>
Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br>
<input type="button" name="pole_orz" value="Oblicz pole" Onclick="pole_orz()"><br><br>
<input type="button" name="obwod_orz" value="Oblicz obwod" Onclick="obwod_orz()"><br><br>
<div style="color:red;font-size:50px;"id="nazwa"></div>
</body>
</html>
