<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 23 — Orzeł</title>
</head>
<body>
    <h2>Drabina oparta o mur</h2>

    <form id="formularz_orz">
        <label for="d_orz">Wysokość oparcia drabiny D [m]:</label>
        <input type="number" id="d_orz" step="any"><br><br>

        <label for="x_orz">Odległość drabiny od muru X [m]:</label>
        <input type="number" id="x_orz" step="any"><br><br>

        <button type="button" onclick="oblicz_orz()">Oblicz</button>
        <br><br>

        <label for="wynik_dlugosc_orz">Długość drabiny [m]:</label>
        <input type="text" id="wynik_dlugosc_orz" readonly><br><br>

        <label for="wynik_kat_orz">Kąt nachylenia [stopnie]:</label>
        <input type="text" id="wynik_kat_orz" readonly>
    </form>

    <script>
        const dlugosc_orz = (d_orz, x_orz) => Math.hypot(d_orz, x_orz);

        const kat_orz = (d_orz, x_orz) => (Math.atan2(d_orz, x_orz) * 180) / Math.PI;

        function oblicz_orz() {
            const d_orz = Number(document.getElementById("d_orz").value);
            const x_orz = Number(document.getElementById("x_orz").value);

            if (!Number.isFinite(d_orz) || !Number.isFinite(x_orz) || d_orz <= 0 || x_orz <= 0) {
                alert("Podaj poprawne dodatnie wartości!");
                return;
            }

            document.getElementById("wynik_dlugosc_orz").value = dlugosc_orz(d_orz, x_orz).toFixed(2);
            document.getElementById("wynik_kat_orz").value = kat_orz(d_orz, x_orz).toFixed(2);
        }
    </script>
</body>
</html>
  </textarea>
