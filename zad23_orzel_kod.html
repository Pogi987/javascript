<textarea cols="90" rows="24" readonly>
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zadanie 23 Orzel</title>

    <script>
        function dlugosc_orz(d_orz, x_orz) {
            return Math.sqrt(Math.pow(d_orz, 2) + Math.pow(x_orz, 2));
        }

        function kat_star(d_orz, x_orz) {
            return Math.atan(d_orz / x_orz) * 180 / Math.PI;
        }

        function oblicz_orz() {
            var d_orz = parseFloat(document.getElementById("d_orz").value);
            var x_orz = parseFloat(document.getElementById("x_orz").value);

            if (isNaN(d_orz) || isNaN(x_orz) || d_orz <= 0 || x_orz <= 0) {
                alert("Podaj poprawne dodatnie wartości!");
                return;
            }

            document.getElementById("wynik_dlugosc").value =
                dlugosc_star(d_orz, x_orz).toFixed(2);

            document.getElementById("wynik_kat").value =
                kat_star(d_orz, x_orz).toFixed(2);
        }
    </script>
</head>

<body>
    <h2>Drabina oparta o mur</h2>

    <form>
        Wysokość oparcia drabiny D [m]:
        <input type="number" id="d_orz" step="any"><br><br>

        Odległość drabiny od muru X [m]:
        <input type="number" id="x_orz" step="any"><br><br>

        <input type="button" value="Oblicz" onclick="oblicz_orz()">
        <br><br>

        Długość drabiny [m]:
        <input type="text" id="wynik_dlugosc" readonly><br><br>

        Kąt nachylenia [stopnie]:
        <input type="text" id="wynik_kat" readonly>
    </form>
</body>
</html>
  </textarea>
