    let x1_orz = parseFloat(prompt("Podaj pierwszą liczbę (x1 - w stopniach):"));

    document.write("x1 = " + x1_orz + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x2 = " + x2_orz + "<br>");

    let rad_orz = (x1_orz * Math.PI) / 180;

    document.write("x1 = " + x1_orz + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x1 = " + rad_orz.toFixed(2) + "<br>");


    let liczba_liter_imienia_star = 5; 
    let wykladnik_orz = liczba_liter_imienia_orz / (liczba_liter_imienia_orz + 2);
    let y1_orz = 3 * Math.pow(x1_orz, wykladnik_orz);
    document.write("y1 = " + y1_orz.toFixed(2) + "<br>");

    let y2_star = 2 * Math.cos(rad_orz) + 3 * Math.sin(rad_orz);
    document.write("y2 = " + y2_orz.toFixed(2) + "<br>");

    let pod_pierwiastkiem_star = Math.pow(x1_orz, 5) + 2 * Math.pow(x2_orz, 4);
    let y3_star = Math.cbrt(pod_pierwiastkiem_orz) * Math.abs(x1_orz - x2_orz);
    document.write("y3 = " + y3_orz.toFixed(2) + "<br>");
</script>
