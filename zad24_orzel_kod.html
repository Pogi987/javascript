<textarea cols="90" rows="24" readonly>
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 24 Orzel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: blue;
            font-size: 18px;
        }
    </style>
</head>
<body>

<script>
    const x1_orz = Number(prompt("Podaj pierwszą liczbę (x1 - w stopniach):"));
    const x2_orz = Number(prompt("Podaj drugą liczbę (x2):"));

    document.write(`x1 = ${x1_orz}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x2 = ${x2_orz}<br>`);

    const rad_orz = x1_orz * (Math.PI / 180);

    document.write(`x1 = ${x1_orz}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x1 = ${rad_orz.toFixed(2)}<br>`);

    const dlugosc_imienia_orz = 5;
    const potega_orz = dlugosc_imienia_orz / (dlugosc_imienia_orz + 2);
    const y1_orz = 3 * (x1_orz ** potega_orz);
    document.write(`y1 = ${y1_orz.toFixed(2)}<br>`);

    const y2_orz = 2 * Math.cos(rad_orz) + 3 * Math.sin(rad_orz);
    document.write(`y2 = ${y2_orz.toFixed(2)}<br>`);

    const wnetrze_pierwiastka_orz = (x1_orz ** 5) + 2 * (x2_orz ** 4);
    const y3_orz = Math.cbrt(wnetrze_pierwiastka_orz) * Math.abs(x1_orz - x2_orz);
    document.write(`y3 = ${y3_orz.toFixed(2)}<br>`);
</script>

</body>
</html>
</textarea>
